name: CodSpeed Ubuntu apt route probe
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  dns_https:
    runs-on: ubuntu-24.04
    steps:
      - name: Read public Ubuntu DNS and HTTPS route status
        run: |
          python3 - <<'PYPROBE'
          import json
          import socket
          import urllib.error
          import urllib.request
          hosts = ['azure.archive.ubuntu.com', 'archive.ubuntu.com', 'security.ubuntu.com']
          for host in hosts:
              try:
                  rows = socket.getaddrinfo(host, 443)
                  print(json.dumps({'probe': 'dns', 'host': host, 'resolved': True, 'records': len(rows)}))
              except socket.gaierror as exc:
                  print(json.dumps({'probe': 'dns', 'host': host, 'resolved': False, 'error_code': exc.errno}))
          package = '/ubuntu/pool/main/g/glibc/libc6-dbg_2.39-0ubuntu8.9_amd64.deb'
          endpoints = {
              'azure_release': 'https://azure.archive.ubuntu.com/ubuntu/dists/noble/InRelease',
              'canonical_release': 'https://archive.ubuntu.com/ubuntu/dists/noble/InRelease',
              'azure_package': 'https://azure.archive.ubuntu.com' + package,
              'canonical_package': 'https://archive.ubuntu.com' + package,
          }
          for name, url in endpoints.items():
              try:
                  with urllib.request.urlopen(urllib.request.Request(url, method='HEAD'), timeout=30) as response:
                      print(json.dumps({'probe': 'https', 'endpoint': name, 'status': response.status}))
              except urllib.error.HTTPError as exc:
                  print(json.dumps({'probe': 'https', 'endpoint': name, 'status': exc.code}))
              except Exception as exc:
                  print(json.dumps({'probe': 'https', 'endpoint': name, 'error_type': type(exc).__name__}))
          PYPROBE
